version: '3.8'

services:
  postgres:
    image: postgres:18.2
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: aspire_db
    # Postgres 18+ expects a single mount at /var/lib/postgresql so the image
    # can create versioned subdirectories (e.g. /var/lib/postgresql/18/docker)
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db_data:
    driver: local
